spring.application.name=tasks
server.port=${PORT:8080}

# Local development: file-based H2 for the operational data (console at /h2-console)
spring.datasource.url=jdbc:h2:file:./data/app
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Vida laboral PDF uploads (processed in memory, never stored)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Analytical warehouse: DuckDB file with the raw datasets and every time-series point
app.warehouse.url=jdbc:duckdb:./data/warehouse.duckdb
# Local Habits CSV (relative to the backend working directory)
app.habits.file=../Data/Habbits2007-2011.csv
# Daily refresh of the public APIs
app.ingestion.cron=0 0 6 * * *

# Errors as RFC 9457 problem details: ResponseStatusException reasons reach the UI in "detail"
spring.mvc.problemdetails.enabled=true
