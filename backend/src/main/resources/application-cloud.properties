# Cloud Run + Cloud SQL (PostgreSQL) through the Cloud SQL Java connector
spring.datasource.url=jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=5
spring.h2.console.enabled=false

# DuckDB runs on the instance's local (ephemeral) disk and is restored from / copied to a
# Cloud Storage bucket mounted at /data after every ingestion
app.warehouse.url=jdbc:duckdb:/tmp/warehouse/warehouse.duckdb
app.warehouse.snapshot=${WAREHOUSE_SNAPSHOT:/data/warehouse.duckdb}
app.habits.file=${HABITS_FILE:/data/habits/Habbits2007-2011.csv}
app.habits.catalog-dir=${HABITS_CATALOG_DIR:/data/habits}

# Instances scale to zero: Cloud Scheduler triggers the daily refresh
app.ingestion.scheduler-enabled=false

# X-Admin-Key (secret ADMIN_KEY) grants admin access to Cloud Scheduler
app.admin.key=${ADMIN_KEY:}
app.admin.required=true

# Google sign-in (Firebase Authentication): only verified @gmail.com accounts; admins by email
app.auth.enabled=true
app.auth.firebase-project=${FIREBASE_PROJECT:react-java-test}
app.auth.allowed-domain=gmail.com
app.admin.emails=${ADMIN_EMAILS:jorgejuanarandilla@gmail.com}
