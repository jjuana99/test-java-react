# Cloud Run + Cloud SQL (PostgreSQL) through the Cloud SQL Java connector
spring.datasource.url=jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${INSTANCE_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=5
spring.h2.console.enabled=false
# Cloud Run has an ephemeral filesystem: mount a volume (e.g. GCS FUSE) at /data
app.warehouse.url=jdbc:duckdb:${WAREHOUSE_PATH:/data/warehouse.duckdb}
app.habits.file=${HABITS_FILE:/data/Habbits2007-2011.csv}
